<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan table</title>
</head>
<body>
    <h1>Latihan table</h1>
    <table border="2" cellspancing="0" cellpadding="3">
        <tr>
                    <td>1,1</td>
                    <td>1,2</td>
                    <td>1,3</td>
                    <td>1,4</td>
        </tr>
        <tr>
                    <td>2,1</td>
                    <td colspan="2" rowspan="2" align="center">?</td>
                    <td>2,4</td>
        </tr>
        <tr>
                    <td>3,1</td>
                    <td>3,4</td>
        </tr>
        <tr>
                    <td>4,1</td>
                    <td>4,2</td>
                    <td>4,3</td>
                    <td>4,4</td>
        </tr>
    </table>
    <table border="2" cellspancing="0" cellpadding="3">
        <br>
        <thead>
            <tr>
                <th rowspan="2">Nama</th>
                <th colspan="2">Alamat</th>

            </tr>
            <tr>
                <th>hadir</th>
                <th>izin</th>

            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Danis</td>
                <td align="center">10</td>
                <td>1</td>
            </tr>
        </tbody>
    </table>
    <br>
    <table border="1" cellspancing="0" cellpadding="3">
    <thead>
        <tr>
            <th rowspan="2">Kategori</th>
            <th rowspan="2">Nama Barang</th>
            <th colspan="2">Mutasi</th>
            <th rowspan="2">Nilai Aset</th>

        </tr>
        <tr>
            <td>Masuk</td>
            <td>Keluar</td>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td rowspan="2">Elektronik</td>
            <td class="left-aligh">Monitor 27 inch</td>
            <td>40</td>
            <td>15</td>
            <td class="left-aligh"> Rp.75.000.000</td>
        </tr>
        <tr>
            <td class="left-aligh">Laptop Bisnis</td>
            <td>25</td>
            <td>10</td>
            <td class="left-aligh">Rp.50.000.000</td>
        </tr>
    </tbody>
     <tfoot>
        <tr class="bold">
            <td colspan="2">Grand Total</td>
            <td>95</td>
            <td>30</td>
            <td class="left-aligh">Rp.275.000.000</td>
        </tr>
     </tfoot>
</table>
</body>
</html>
