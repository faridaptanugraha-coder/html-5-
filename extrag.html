<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>extrag Tag</title>
</head>
<body>
    <!-- Abbreviation <abbr> digunakan ketika dibaca menjadi per huruf--> 
    <P>saat ini kita sedang berada di <abbr title="Lembaga Kursus dan Pelatihan">LKP Indo jaya</abbr></P>
    
   
    <!-- Acronym <acronym> digunakan ketika dibaca menjadi per kata-->
        <p>Lahan Kosong di pinggir kuburan tersebut dibanguns sebuah <acronym title="Koperasi Desa">KOPDES</acronym></p>

    <!-- Insert dan Delete -->
     <p>Saya sangat <del>MENOLAK</del> <ins>Mendukung</ins> kebijakan Pemerintah</p>
</body>
</html>
